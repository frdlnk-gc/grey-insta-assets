# ============================================================
# Grey Insta Auto-Post · Zeitgeber
#
# Feuert zu den vier Posting-Slots von @greycareers.de einen Tick
# an das Make-Szenario "Grey Insta Auto-Post". Make laedt
# plan.json von insta-bau.green-careers.de und veroeffentlicht
# die fuer diesen Slot geplanten Posts auf Instagram + Facebook.
#
# EIGENER Hook - NICHT der von GreenCareers. Ein fremder Tick
# wuerde auf dem falschen Account posten.
#
# Slots Berlin -> UTC (MESZ, gueltig bis 25.10.2026):
#   10:00->08   11:00->09   12:00->10   18:00->16
# Ab Winterzeit (26.10.2026) jede UTC-Stunde um 1 erhoehen.
#
# Secret: MAKE_TICK_HOOK = Make-Webhook-URL des Grey-Szenarios
# ============================================================
name: Grey Insta Auto-Post Tick

# SCHARF seit 26.08.2026. Make-Szenario 7101136 ist aktiv und getestet.
on:
  schedule:
    # Je Slot eine EIGENE Cron-Zeile: nur so laesst sich der Slot spaeter
    # eindeutig aus github.event.schedule ableiten.
    - cron: "0 6 * * *"    # 08:00 Berlin
    - cron: "0 8 * * *"    # 10:00 Berlin
    - cron: "0 9 * * *"    # 11:00 Berlin
    - cron: "0 10 * * *"   # 12:00 Berlin
    - cron: "0 15 * * *"   # 17:00 Berlin
    - cron: "0 16 * * *"   # 18:00 Berlin
    - cron: "0 17 * * *"   # 19:00 Berlin
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot manuell (HH:MM Berlin)"
        required: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Slot bestimmen und Tick senden
        env:
          HOOK: ${{ secrets.MAKE_TICK_HOOK }}
          STORY_HOOK: ${{ secrets.MAKE_STORY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret MAKE_TICK_HOOK ist nicht gesetzt."
            exit 1
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            # Slot aus der GEPLANTEN Cron-Zeile, NICHT aus der Uhrzeit bei Ausfuehrung.
            # Gemessen 25./26.08.2026: GitHub-Crons starten 27-109 min zu spaet. Mit
            # "date -u +%H" rutscht ein verspaeteter Lauf in die naechste Stunde und
            # faellt aus der Zuordnung - der 19:00-Slot am 26.08. hat so nichts
            # veroeffentlicht, bei gruenem Haken. Genau das darf nicht wieder passieren.
            case "${{ github.event.schedule }}" in
              "0 6 * * *")  SLOT="08:00" ;;
              "0 8 * * *")  SLOT="10:00" ;;
              "0 9 * * *")  SLOT="11:00" ;;
              "0 10 * * *") SLOT="12:00" ;;
              "0 15 * * *") SLOT="17:00" ;;
              "0 16 * * *") SLOT="18:00" ;;
              "0 17 * * *") SLOT="19:00" ;;
              *) echo "::error::Unbekannte Cron-Zeile '${{ github.event.schedule }}' - kein Slot zugeordnet."; exit 1 ;;
            esac
          fi
          echo "Tick fuer Slot $SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-connrefused --retry-delay 10 "$HOOK?slot=$SLOT"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-connrefused --retry-delay 10 "$STORY_HOOK?slot=$SLOT"
